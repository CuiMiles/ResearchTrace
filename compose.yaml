# Lite deployment for a small server (about 2 vCPU / 2 GiB):
#   docker compose --profile lite up -d --build          # API + two workers on 127.0.0.1:18970
#   RT_DOMAIN=demo.example.org docker compose --profile lite --profile https up -d
#                                                         # + Caddy with automatic HTTPS on 80/443
# Configuration and keys come from the server-only .env (see .env.example).
x-app: &app
  build:
    context: .
    dockerfile: deploy/Dockerfile
    args:
      REGISTRY: ${RT_IMAGE_REGISTRY:-}
  image: researchtrace:lite
  env_file: .env
  volumes: ["rt-data:/app/data"]
  restart: unless-stopped

services:
  api:
    <<: *app
    profiles: [lite]
    environment:
      RT_HOST: 0.0.0.0
      RT_PORT: 18970
      RT_DATA_DIR: /app/data
      RT_SECURE_COOKIE: ${RT_SECURE_COOKIE:-false}
      GEMINI_PROXY: ${GEMINI_CONTAINER_PROXY:-}
      RT_PUBLIC_PROXY: ${PUBLIC_CONTAINER_PROXY:-}
    ports: ["127.0.0.1:${RT_PORT:-18970}:18970"]
    mem_limit: 512m
    cpus: 0.7
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:18970/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Parsing and indexing never block questions: two pools over one durable queue.
  worker-documents:
    <<: *app
    profiles: [lite]
    command: [python, -m, services.worker.main]
    environment:
      RT_WORKER_POOL: documents
      RT_DATA_DIR: /app/data
      GEMINI_PROXY: ${GEMINI_CONTAINER_PROXY:-}
      RT_PUBLIC_PROXY: ${PUBLIC_CONTAINER_PROXY:-}
    mem_limit: 640m
    cpus: 0.8

  worker-interactive:
    <<: *app
    profiles: [lite]
    command: [python, -m, services.worker.main]
    environment:
      RT_WORKER_POOL: interactive
      RT_DATA_DIR: /app/data
      GEMINI_PROXY: ${GEMINI_CONTAINER_PROXY:-}
      RT_PUBLIC_PROXY: ${PUBLIC_CONTAINER_PROXY:-}
    mem_limit: 384m
    cpus: 0.5

  caddy:
    profiles: [https]
    image: ${RT_IMAGE_REGISTRY:-}caddy:2.10.2
    depends_on: [api]
    environment:
      RT_DOMAIN: ${RT_DOMAIN:-localhost}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    restart: unless-stopped

volumes:
  rt-data:
  caddy-data:
