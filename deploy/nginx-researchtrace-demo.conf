# Include inside the dedicated ResearchTrace virtual host after installing the
# reviewed video files, poster and captions under /opt/researchtrace/demo-media.
location = /demo-media/researchtrace-demo-1080p.mp4 {
    alias /opt/researchtrace/demo-media/researchtrace-demo-1080p.mp4;
    default_type video/mp4;
    sendfile on;
    gzip off;
    expires 1h;
}
location = /demo-media/researchtrace-demo-1080p.webm {
    alias /opt/researchtrace/demo-media/researchtrace-demo-1080p.webm;
    default_type video/webm;
    sendfile on;
    gzip off;
    expires 1h;
}
location = /demo-media/researchtrace-demo-poster.jpg {
    alias /opt/researchtrace/demo-media/researchtrace-demo-poster.jpg;
    default_type image/jpeg;
    expires 1h;
}
location = /demo-media/researchtrace-demo-zh.vtt {
    alias /opt/researchtrace/demo-media/researchtrace-demo-zh.vtt;
    types {}
    default_type text/vtt;
    expires 1h;
}
location ^~ /demo-media/ { return 404; }
