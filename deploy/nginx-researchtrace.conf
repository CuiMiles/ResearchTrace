# Dedicated site; never replace nginx's existing default site.
server {
    listen 80;
    listen [::]:80;
    server_name researchtrace.sluna.xyz;
    client_max_body_size 256m;
    location ^~ /.well-known/acme-challenge/ {
        root /opt/researchtrace/acme;
    }
    location / {
        proxy_pass http://127.0.0.1:18970;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # Never retry a submitted model/job POST on another upstream.
        proxy_next_upstream off;
    }
}
