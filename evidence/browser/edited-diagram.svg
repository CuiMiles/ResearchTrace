<svg id="research-diagram-2" width="100%" xmlns="http://www.w3.org/2000/svg" class="flowchart" style="max-width: 456px;" viewBox="0 0 456 65" aria-roledescription="flowchart-v2"><style>#research-diagram-2{font-family:system-ui,sans-serif;font-size:16px;fill:#172b4d;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#research-diagram-2 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#research-diagram-2 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#research-diagram-2 .error-icon{fill:hsl(38.8235294118, 68%, 100%);}#research-diagram-2 .error-text{fill:#000000;stroke:#000000;}#research-diagram-2 .edge-thickness-normal{stroke-width:1px;}#research-diagram-2 .edge-thickness-thick{stroke-width:3.5px;}#research-diagram-2 .edge-pattern-solid{stroke-dasharray:0;}#research-diagram-2 .edge-thickness-invisible{stroke-width:0;fill:none;}#research-diagram-2 .edge-pattern-dashed{stroke-dasharray:3;}#research-diagram-2 .edge-pattern-dotted{stroke-dasharray:2;}#research-diagram-2 .marker{fill:#7f94ad;stroke:#7f94ad;}#research-diagram-2 .marker.cross{stroke:#7f94ad;}#research-diagram-2 svg{font-family:system-ui,sans-serif;font-size:16px;}#research-diagram-2 p{margin:0;}#research-diagram-2 .label{font-family:system-ui,sans-serif;color:#172b4d;}#research-diagram-2 .cluster-label text{fill:#000000;}#research-diagram-2 .cluster-label span{color:#000000;}#research-diagram-2 .cluster-label span p{background-color:transparent;}#research-diagram-2 .label text,#research-diagram-2 span{fill:#172b4d;color:#172b4d;}#research-diagram-2 .node rect,#research-diagram-2 .node circle,#research-diagram-2 .node ellipse,#research-diagram-2 .node polygon,#research-diagram-2 .node path{fill:#eaf0fb;stroke:#6685bf;stroke-width:1px;}#research-diagram-2 .rough-node .label text,#research-diagram-2 .node .label text,#research-diagram-2 .image-shape .label,#research-diagram-2 .icon-shape .label{text-anchor:middle;}#research-diagram-2 .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#research-diagram-2 .rough-node .label,#research-diagram-2 .node .label,#research-diagram-2 .image-shape .label,#research-diagram-2 .icon-shape .label{text-align:center;}#research-diagram-2 .node.clickable{cursor:pointer;}#research-diagram-2 .root .anchor path{fill:#7f94ad!important;stroke-width:0;stroke:#7f94ad;}#research-diagram-2 .arrowheadPath{fill:#0b0b0b;}#research-diagram-2 .edgePaths .path{stroke:#7f94ad;stroke-width:1px;}#research-diagram-2 .flowchart-link{stroke:#7f94ad;fill:none;}#research-diagram-2 .edgeLabel{background-color:hsl(98.8235294118, 68%, 95.0980392157%);text-align:center;}#research-diagram-2 .edgeLabel p{background-color:hsl(98.8235294118, 68%, 95.0980392157%);}#research-diagram-2 .edgeLabel rect{opacity:0.5;background-color:hsl(98.8235294118, 68%, 95.0980392157%);fill:hsl(98.8235294118, 68%, 95.0980392157%);}#research-diagram-2 .labelBkg{background-color:rgba(240, 251, 234.0000000001, 0.5);}#research-diagram-2 .cluster rect{fill:hsl(38.8235294118, 68%, 100%);stroke:hsl(38.8235294118, 28%, 90%);stroke-width:1px;}#research-diagram-2 .cluster text{fill:#000000;}#research-diagram-2 .cluster span{color:#000000;}#research-diagram-2 .node .collapsed-indicator{fill:hsl(38.8235294118, 28%, 90%);stroke:none;opacity:0.6;}#research-diagram-2 .node .collapsed-separator{stroke:hsl(38.8235294118, 28%, 90%);stroke-width:0.75px;}#research-diagram-2 div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:system-ui,sans-serif;font-size:12px;background:hsl(38.8235294118, 68%, 100%);border:1px solid hsl(38.8235294118, 28%, 90%);border-radius:2px;pointer-events:none;z-index:100;}#research-diagram-2 .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#172b4d;}#research-diagram-2 rect.text{fill:none;stroke-width:0;}#research-diagram-2 .icon-shape,#research-diagram-2 .image-shape{background-color:hsl(98.8235294118, 68%, 95.0980392157%);text-align:center;}#research-diagram-2 .icon-shape p,#research-diagram-2 .image-shape p{background-color:hsl(98.8235294118, 68%, 95.0980392157%);padding:2px;}#research-diagram-2 .icon-shape .label rect,#research-diagram-2 .image-shape .label rect{opacity:0.5;background-color:hsl(98.8235294118, 68%, 95.0980392157%);fill:hsl(98.8235294118, 68%, 95.0980392157%);}#research-diagram-2 .label-icon{display:inline-block;height:1em;overflow:visible;vertical-align:-0.125em;}#research-diagram-2 .node .label-icon path{fill:currentColor;stroke:revert;stroke-width:revert;}#research-diagram-2 .node .neo-node{stroke:#6685bf;}#research-diagram-2 [data-look="neo"].node rect,#research-diagram-2 [data-look="neo"].cluster rect,#research-diagram-2 [data-look="neo"].node polygon{stroke:url(#research-diagram-2-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#research-diagram-2 [data-look="neo"].swimlane.cluster rect{filter:none;}#research-diagram-2 [data-look="neo"].node path{stroke:url(#research-diagram-2-gradient);stroke-width:1px;}#research-diagram-2 [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#research-diagram-2 [data-look="neo"].node .neo-line path{stroke:#6685bf;filter:none;}#research-diagram-2 [data-look="neo"].node circle{stroke:url(#research-diagram-2-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#research-diagram-2 [data-look="neo"].node circle .state-start{fill:#000000;}#research-diagram-2 [data-look="neo"].icon-shape .icon{fill:url(#research-diagram-2-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#research-diagram-2 [data-look="neo"].icon-shape .icon-neo path{stroke:url(#research-diagram-2-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#research-diagram-2 :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g><marker id="research-diag