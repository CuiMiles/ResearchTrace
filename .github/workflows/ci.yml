name: ResearchTrace CI
on:
  push:
    branches: [main, "claude/**", "complete/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RT_DATA_DIR: ${{ runner.temp }}/researchtrace-tests
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      ALLOW_PAID_FALLBACK: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-test.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked dependencies (no API credentials)
        run: |
          python -m pip install -r requirements-test.lock
          npm ci --prefix apps/web --no-audit --no-fund
      - name: Backend regression and deployment restore tests
        run: |
          python -m pytest tests/unit tests/integration -q
          python -m unittest discover -s deploy -p 'test_*.py' -v
          python -m ruff check services --select E9,F63,F7,F82
      - name: Typecheck and production build
        run: npm run build --prefix apps/web
      - name: Generate API contract
        run: python scripts/export_contract.py
      - name: Validate both deployment plans without secrets
        run: |
          cp .env.example .env
          chmod 600 .env
          docker compose --profile lite config --quiet
          sudo install -d -m 700 /opt/researchtrace/private
          sudo install -m 600 .env.example /opt/researchtrace/private/runtime.env
          sudo chown -R "$USER" /opt/researchtrace
          docker compose -f deploy/compose.ecs.yaml config --quiet
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 3
  container:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: deploy/web-dist
      - name: Build runtime from the checked frontend
        run: docker build -f deploy/Dockerfile.prebuilt -t researchtrace:ci .
      - name: Check container health, private API and non-root user
        run: |
          docker run -d --name rt-ci -p 127.0.0.1:18970:18970 --memory=384m researchtrace:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18970/healthz; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18970/healthz
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:18970/api/v1/documents)" = 401
          test "$(docker exec rt-ci id -u)" = 10001
      - name: Container diagnostics (no credentials are provided to CI)
        if: failure()
        run: docker logs rt-ci
      - name: Clean up owned container
        if: always()
        run: docker rm -f rt-ci || true
